<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kimo | أمن وإدارة الشبكات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #c9a84c; --gold-light: #e8c96a; --gold-pale: #f5e4a0;
      --royal: #1a0533; --royal-mid: #2d0a5e; --royal-light: #3d1280;
      --white: #f8f4ff; --dim: #b8a8d0;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Tajawal', sans-serif; background-color: var(--royal); color: var(--white); overflow-x: hidden; min-height: 100vh; }
    .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .star { position: absolute; border-radius: 50%; background: var(--gold-pale); opacity: 0; animation: twinkle var(--dur, 4s) var(--delay, 0s) infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.6); } 50% { opacity: var(--op, 0.5); transform: scale(1); } }
    .top-glow { position: fixed; top: -120px; left: 50%; transform: translateX(-50%); width: 600px; height: 300px; background: radial-gradient(ellipse at center, rgba(201,168,76,0.25) 0%, transparent 70%); pointer-events: none; z-index: 1; }
    main { position: relative; z-index: 2; max-width: 780px; margin: 0 auto; padding: 60px 24px 80px; display: flex; flex-direction: column; align-items: center; gap: 48px; }
    .profile-card { width: 100%; background: linear-gradient(145deg, rgba(45,10,94,0.85), rgba(26,5,51,0.95)); border: 1px solid rgba(201,168,76,0.35); border-radius: 28px; padding: 52px 40px 44px; text-align: center; position: relative; overflow: hidden; box-shadow: 0 0 60px rgba(201,168,76,0.12), 0 30px 80px rgba(0,0,0,0.5); animation: fadeUp 0.9s ease both; }
    .profile-card::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent, transparent 40px, rgba(201,168,76,0.025) 40px, rgba(201,168,76,0.025) 41px); pointer-events: none; }
    .crown { font-size: 2.2rem; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 0 12px rgba(201,168,76,0.7)); animation: float 3.5s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .avatar-wrap { position: relative; display: inline-block; margin: 16px 0 24px; }
    .avatar-ring { width: 130px; height: 130px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--royal-mid), var(--gold-light)); padding: 3px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(201,168,76,0.4); }
    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--royal); }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; object-position: center top; border-radius: 50%; display: block; }
    .gold-line { display: block; width: 80px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto 20px; }
    .name { font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, var(--gold-pale), var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 3px; margin-bottom: 10px; }
    .title-badge { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05)); border: 1px solid rgba(201,168,76,0.4); border-radius: 50px; padding: 8px 22px; font-size: 0.9rem; font-weight: 500; color: var(--gold-pale); margin-bottom: 22px; letter-spacing: 0.5px; }
    .title-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(201,168,76,0.6); } 50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(201,168,76,0); } }
    .bio { font-size: 0.97rem; color: var(--dim); line-height: 1.9; max-width: 480px; margin: 0 auto; }
    .section-title { font-family: 'Cinzel', serif; font-size: 1rem; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; display: flex; align-items: center; gap: 14px; width: 100%; }
    .section-title::before, .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4)); }
    .section-title::before { background: linear-gradient(270deg, transparent, rgba(201,168,76,0.4)); }
    .social-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; width: 100%; animation: fadeUp 0.9s 0.3s ease both; }
    .social-card { position: relative; border-radius: 20px; padding: 28px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-decoration: none; color: var(--white); overflow: hidden; border: 1px solid rgba(201,168,76,0.2); background: linear-gradient(145deg, rgba(45,10,94,0.7), rgba(26,5,51,0.9)); transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease; cursor: pointer; }
    .social-card:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(201,168,76,0.6); box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 30px rgba(201,168,76,0.15); }
    .card-snapchat:hover { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(255,252,0,0.2); }
    .card-instagram:hover { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(225,48,108,0.2); }
    .card-whatsapp:hover { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(37,211,102,0.2); }
    .card-phone:hover { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(201,168,76,0.2); }
    .card-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; }
    .card-snapchat .card-icon { background: linear-gradient(135deg, #f7d300, #ffec00); }
    .card-instagram .card-icon { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .card-whatsapp .card-icon { background: linear-gradient(135deg, #128c7e, #25d366); }
    .card-phone .card-icon { background: linear-gradient(135deg, #2d0a5e, #c9a84c); border: 1px solid rgba(201,168,76,0.4); }
    .card-name { font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700; color: var(--gold-pale); letter-spacing: 1px; }
    .card-handle { font-size: 0.8rem; color: var(--dim); direction: ltr; }
    .card-arrow { font-size: 0.75rem; color: var(--gold); opacity: 0; transform: translateX(4px); transition: opacity 0.3s, transform 0.3s; }
    .social-card:hover .card-arrow { opacity: 1; transform: translateX(0); }
    .social-card::before { content: ''; position: absolute; top: 0; left: -75%; width: 60%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.06), transparent); transform: skewX(-20deg); transition: left 0.6s ease; }
    .social-card:hover::before { left: 130%; }
    footer { position: relative; z-index: 2; text-align: center; padding-bottom: 32px; font-size: 0.78rem; color: rgba(184,168,208,0.4); letter-spacing: 1px; }
    footer span { color: var(--gold); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 500px) { .name { font-size: 1.6rem; } .social-grid { grid-template-columns: 1fr; } .profile-card { padding: 40px 24px 36px; } }
  </style>
</head>
